name: Deploy

on:
  push:
    branches:
      - main

jobs:
  pre-deploy:
    name: Pre-deploy Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

      # Vercel deployment is triggered automatically via GitHub integration.
      # Add migration steps here in the future if needed:
      # - name: Run Supabase migrations
      #   run: npx supabase db push
